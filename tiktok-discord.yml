name: TikTok zu Discord

on:
  schedule:
    - cron: '*/15 * * * *'   # alle 15 Minuten
  workflow_dispatch:          # manueller Test-Button in GitHub

permissions:
  contents: write            # damit der Workflow last_tiktok_id.txt committen darf

jobs:
  check-tiktok:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Abhängigkeiten installieren
        run: pip install requests

      - name: TikTok prüfen und ggf. nach Discord posten
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python check_tiktok.py

      - name: Status zurück ins Repo committen
        run: |
          git config user.name "tiktok-bot"
          git config user.email "actions@github.com"
          git add last_tiktok_id.txt
          git diff --staged --quiet || git commit -m "Update letzte TikTok-Video-ID"
          git push
